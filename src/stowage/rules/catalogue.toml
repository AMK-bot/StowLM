open_question = [9]
description = "D61/C5 and D66/A4: primary class only; no subsidiary-risk or recursive compound-declaration matching. Configured parent class 1 includes all class-1 divisions and compatibility groups, including 1.4S and 1.1D, unless listed in exempt_divisions (default empty). Preserve original hazard class strings for independent IMDG checks. Container.direct_delivery is derived from the current port rule and must match in both directions. Such exports load from a truck in one lift and imports discharge to a truck in one lift; never place or retrieve them in the yard. APPROXIMATION: no truck timing is modelled; the direct-delivery box is available when its lift comes."

[[rules]]
id = "port.e3.quay_crossing"
title = "Quay crane crossing past on-deck stacks"
source = "user specification (D62)"
scope = "port"
hardness = "hard"
status = "provisional"
domain_rows = ["Height limit per port, e.g. only 2 or 3 high (E3)", "Physical access: only the top box is reachable; below deck needs the hatch cover clear; ship stacks fill bottom-up"]
enforced_by = ["checker", "feasibility_engine", "solver"]
references = ["docs/expert/2026-10-28-written-answers.md: Q3, 28 Oct 2026", "docs/decisions.md: D62 amendment, separate quay and yard heights", "experiments/fleet/orders/w2-x1-contract.md: C6 and Addendum 1 A2/A3/A8", "docs/decisions.md: D69, sequencing and counted blocker clearance"]
parameters = { "max_crane_height_tiers" = { "profile_field" = "port.max_crane_height_tiers", "unit" = "tiers", "provenance" = { "document" = "docs/decisions.md and experiments/fleet/orders/w2-x1-contract.md", "clause" = "D62 amendment; C6; Addendum 1 A2/A8; D69", "assumption" = "On-deck ship stack height >= the resolved quay H blocks crossing. This parameter never supplies the independent yard threshold." } }, "berthing_side" = { "profile_field" = "port.berthing_side", "unit" = "1", "provenance" = { "assumption" = "User specification (D62), C6: ship side at quay; port default is synthetic." } }, "activation_path" = { "value" = "INACTIVE while activation.rule_freeze_v1 is false. When true, ship-side crossing applies at an operational resolved PortProfile with known max_crane_height_tiers and berthing_side; later calls resolve PortCall.archetype. Environment-only unknown crane limits are skipped. No PortRuleRef opt-in.", "unit" = "1", "provenance" = { "document" = "docs/decisions.md and experiments/fleet/orders/w2-x1-contract.md", "clause" = "D62; Addendum 1 A2/A3/A8; D69", "assumption" = "One shared rule-freeze-v1 switch; separate ship geometry and quay H from yard equipment limits." } } }
expert_rules = ["E3"]
open_question = []
description = "D62/C6, Addenda A2/A8 and D69: H governs ship-side crossing; an on-deck stack at height >= H blocks the path, excluding source and target stacks. Ship checks on-deck stacks only; hold contents never block because cranes pass over hatch covers. Load/discharge from/to quay or either truck checks rows strictly between the quay-side edge and the target row in its bay, including both 20-foot sub-bays for a 40-foot footprint. A same-bay shift goes directly along the boom through rows strictly between source and target. A shift to another bay goes via the quay: source row to quay edge in the source bay, then quay edge to target row in the target bay. A hatch-cover lift off/on checks rows between the quay-side edge and the cover's quay-side-most row; its own rows are already clear, and the cover lands on the quay. APPROXIMATION: cranes do not gantry with cargo over the ship; a cover landing elsewhere requires a labelled approximation. Under D69, Stage A without a ship-side shift action sequences a bay's far rows before near rows. An action that brings a row to H while a farther row in the same bay still needs a lift at this call is a dead end. Existing H-high blockers require a counted shift where the action is available; unshiftable fixed-background blockers are rejected and counted. Unknown later-call crane limits are skipped, never replaced by placeholders."

[[rules]]
id = "port.e3.yard_crossing"
title = "Yard crane crossing past stacks at the effective yard limit"
source = "user specification (D62)"
scope = "port"
hardness = "hard"
status = "provisional"
domain_rows = ["Height limit per port, e.g. only 2 or 3 high (E3)", "Physical access: only the top box is reachable; below deck needs the hatch cover clear; ship stacks fill bottom-up"]
enforced_by = ["checker", "feasibility_engine", "solver"]
references = ["docs/expert/2026-10-28-written-answers.md: Q3, 28 Oct 2026", "docs/decisions.md: D62 amendment, separate quay and yard heights", "experiments/fleet/orders/w2-x1-contract.md: C6 and Addendum 1 A2/A3/A8", "docs/decisions.md: D69, sequencing and counted blocker clearance"]
parameters = { "yard_max_tiers" = { "profile_field" = "port.yard_max_tiers", "unit" = "tiers", "provenance" = { "document" = "docs/decisions.md and experiments/fleet/orders/w2-x1-contract.md", "clause" = "D62 amendment; C6; Addendum 1 A2/A8; D69", "assumption" = "Independent port-wide yard storage limit; resolve the minimum with the actual traversed block and its referenced equipment." } }, "block_max_tiers" = { "profile_field" = "port.yard.blocks.max_tiers", "unit" = "tiers", "provenance" = { "document" = "docs/decisions.md and experiments/fleet/orders/w2-x1-contract.md", "clause" = "D62 amendment; C6; Addendum 1 A2/A8; D69", "assumption" = "Use the actual traversed YardBlock, not the minimum or maximum of unrelated blocks." } }, "equipment_stack_tiers" = { "profile_field" = "port.equipment.stack_tiers", "unit" = "tiers", "provenance" = { "document" = "docs/decisions.md and experiments/fleet/orders/w2-x1-contract.md", "clause" = "D62 amendment; C6; Addendum 1 A2/A8; D69", "assumption" = "Resolve each traversed block.equipment_id to its Equipment.stack_tiers; clearance notation is informational, not the storage limit." } }, "truck_lane_side" = { "profile_field" = "port.yard.blocks.truck_lane_side", "unit" = "1", "provenance" = { "assumption" = "User specification (D62), C6: low is row 1 side, high is row n side; low default is synthetic." } }, "effective_yard_limit" = { "value" = "min(block.max_tiers, yard_max_tiers, equipment.stack_tiers)", "unit" = "tiers", "provenance" = { "document" = "docs/decisions.md and experiments/fleet/orders/w2-x1-contract.md", "clause" = "D62 amendment; Addendum 1 A8", "assumption" = "Quay H is not an input. Yard storage and crossing share the same effective independent yard limit." } }, "activation_path" = { "value" = "INACTIVE while activation.rule_freeze_v1 is false. When true, yard crossing applies at an operational resolved PortProfile with known block, yard and referenced equipment limits; H is not required for yard crossing. Environment-only unknown operating limits are skipped. No PortRuleRef opt-in.", "unit" = "1", "provenance" = { "document" = "docs/decisions.md and experiments/fleet/orders/w2-x1-contract.md", "clause" = "D62 amendment; Addendum 1 A2/A8; D69", "assumption" = "One shared switch, independent yard activation inputs. Known yard operating limits do not depend on known quay H." } } }
expert_rules = ["E3"]
open_question = []
description = "D62/C6, Addenda A2/A8 and D69: yard blocking height is yard_blocking_tiers(port, block) = min(block.max_tiers, yard_max_tiers, equipment.stack_tiers), independent of quay H. A yard stack at or above that effective yard height blocks its crossing path; exclude source and target stacks. Yard 40'/45' footprints check the union of every 20-foot bay they span. Same-bay yard lifts cross intervening rows; lane lifts use rows toward truck_lane_side; between blocks use both lane crossings. APPROXIMATION: between yard bays in one block, traverse intervening rows in the source bay, then intervening bays at the destination row. D69 yard dig-out clears a blocking top box first through legal crossing paths, counting each extra lift. It requires no new planner action. Clearance notation remains informational and never substitutes for the effective storage/equipment limit. Laem Chabang-like yard height remains synthetic RTG 5 with activation on or off; no quay H value enlarges or shrinks it."

