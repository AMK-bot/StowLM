parameters = { "classes" = { "profile_field" = "port.port_rules", "unit" = "1", "provenance" = { "document" = "Expert written answers, 28 Oct 2026", "clause" = "Q9", "assumption" = "Expert Q9, 28 Oct 2026: select the matching PortRuleRef.params.classes for this rule id; Laem Chabang-like value is [1]. No rule ref means no port-specific class restriction." } }, "include_subsidiary_risks" = { "value" = false, "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D66", "assumption" = "D66/Addendum 1 A4: primary class only; subsidiary risks and recursive DangerousGoods.additional declarations do not trigger this port rule." } }, "activation_path" = { "value" = "activation.rule_freeze_v1 = true AND matching PortRuleRef in the resolved current/later PortProfile.port_rules; no matching rule ref means no restriction. Later calls resolve from PortCall.archetype.", "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D61/D62/D64; Addendum 1 A3-A5", "assumption" = "Addendum 1 A5: explicit activation route; legacy port rules remain active while new D61/D62/D64 rules are gated." } }, "exempt_divisions" = { "value" = [], "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D66", "assumption" = "D66/A4 default empty exemption set: all class-1 divisions, including 1.4S, apply. A confirmed exemption can be declared by PortRuleRef.params.exempt_divisions; no implicit exemption." } } }
