hog + 0.5*abs(M_wv,hog); sag <= perm_sag + 0.5*abs(M_wv,sag). Never combine unlike signs." } }, "strength_sampling_events" = { "value" = ["hatch_cover_events", "bay_completions", "last_discharge", "departure"], "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D64", "assumption" = "APPROXIMATION: D64 strength sampling includes these states and the top surrogate states." } }, "strength_top_surrogate_count" = { "value" = 3, "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D64", "assumption" = "APPROXIMATION: D64 samples the top 3 states by max-over-stations surrogate ratio." } }, "shear_limit_mode" = { "value" = "seagoing", "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D64", "assumption" = "APPROXIMATION: D64 still-water shear limit equals the seagoing permissible." } }, "open_hatch_condition" = { "value" = "immersion_angle_exceeds_max_list_rad", "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D64", "assumption" = "APPROXIMATION: D64 deck-edge/coaming immersion angle at equilibrium trim must exceed max_list_rad; open hatches may then remain open." } }, "maximum_draughts" = { "value" = ["berth", "load_line"], "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D64", "assumption" = "D64 applies both upper draught limits, with no lower draught bound in port." } }, "lower_draught_bound_applied" = { "value" = false, "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D64", "assumption" = "D64 excludes minimum forward draught and seagoing lower draught/displacement bands from in-port criteria." } }, "ballast_changeover_mode" = { "value" = "single_index_k", "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D64", "assumption" = "APPROXIMATION: D64 arrival fills up to longest passing prefix k, departure fills thereafter, each with HEEL-P/S transfer preserving pair total; pump time is not modelled." } }, "report_ballast_changeover_index" = { "value" = true, "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D64", "assumption" = "D64 checker report records changeover move index k." } }, "departure_full_seagoing_check" = { "value" = true, "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D64", "assumption" = "D64 departure keeps full D57 checks; in-port criteria omit seagoing GZ/weather, D40 trim window, lower forward draught, visibility and lashing accelerations." } }, "activation_path" = { "value" = "activation.rule_freeze_v1 = true: automatically applies to every operational current-port cargo sequence; no PortRuleRef opt-in. Checker evaluates every lift and departure keeps full D57.", "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D61/D62/D64; Addendum 1 A3-A5", "assumption" = "Addendum 1 A5: explicit activation route; legacy port rules remain active while new D61/D62/D64 rules are gated." } } , "equilibrium_residual_tolerance" = {"value" = 2e-06, "unit" = "1", "provenance" = {"document" = "Existing checker numerical policy, 28 Oct 2026", "clause" = "D64 P1; stability._in_port_criteria, hydrostatics._solve, stability_tables._solve, stability_equilibrium.floating_equilibrium", "assumption" = "Numerical implementation default, not a safety allowance or expert-confirmed physical limit. P1 maximum finite scaled residual norm; larger residuals fail hard."}}, "equilibrium_solver_tolerance" = {"value" = 2e-10, "unit" = "1", "provenance" = {"document" = "Existing checker numerical policy, 28 Oct 2026", "clause" = "D64 P1; stability._in_port_criteria, hydrostatics._solve, stability_tables._solve, stability_equilibrium.floating_equilibrium", "assumption" = "Numerical implementation default, not a safety allowance or expert-confirmed physical limit. Direct/table bounded least-squares xtol, ftol and gtol."}}, "equilibrium_max_function_evaluations" = {"value" = 100, "unit" = "1", "provenance" = {"document" = "Existing checker numerical policy, 28 Oct 2026", "clause" = "D64 P1; stability._in_port_criteria, hydrostatics._solve, stability_tables._solve, stability_equilibrium.floating_equilibrium", "assumption" = "Numerical implementation default, not a safety allowance or expert-confirmed physical limit. Direct/table bounded least-squares max_nfev; function evaluations, not a universal iteration cap."}}, "equilibrium_root_tolerance" = {"value" = 1e-09, "unit" = "1", "provenance" = {"document" = "Existing checker numerical policy, 28 Oct 2026", "clause" = "D64 P1; stability._in_port_criteria, hydrostatics._solve, stability_tables._solve, stability_equilibrium.floating_equilibrium", "assumption" = "Numerical implementation default, not a safety allowance or expert-confirmed physical limit. Table root tolerance and coupled liquid/hull root xtol."}}, "equilibrium_liquid_cg_tolerance_m" = {"value" = 1e-07, "unit" = "m", "provenance" = {"document" = "Existing checker numerical policy, 28 Oct 2026", "clause" = "D64 P1; stability._in_port_criteria, hydrostatics._solve, stability_tables._solve, stability_equilibrium.floating_equilibrium", "assumption" = "Numerical implementation default, not a safety allowance or expert-confirmed physical limit. Liquid/hull CG residual norm must be strictly below this value."}}, "equilibrium_liquid_fixed_point_iterations" = {"value" = 6, "unit" = "1", "provenance" = {"document" = "Existing checker numerical policy, 28 Oct 2026", "clause" = "D64 P1; stability._in_port_criteria, hydrostatics._solve, stability_tables._solve, stability_equilibrium.floating_equilibrium", "assumption" = "Numerical implementation default, not a safety allowance or expert-confirmed physical limit. Maximum initial liquid/hull fixed-point iterations before coupled-root fallback."}}, "equilibrium_liquid_root_max_function_evaluations" = {"value" = 80, "unit" = "1", "provenance" = {"document" = "Existing checker numerical policy, 28 Oct 2026", "clause" = "D64 P1; stability._in_port_criteria, hydrostatics._solve, stability_tables._solve, stability_equilibrium.floating_equilibrium", "assumption" = "Numerical implementation default, not a safety allowance or expert-confirmed physical limit. Coupled liquid/hull root maxfev option; function evaluations, not physical lifts."}}, "equilibrium_nonconvergence_is_hard" = {"value" = true, "unit" = "1", "provenance" = {"document" = "Existing checker numerical policy, 28 Oct 2026", "clause" = "D64 P1; stability._in_port_criteria, hydrostatics._solve, stability_tables._solve, stability_equilibrium.floating_equilibrium", "assumption" = "Numerical implementation default, not a safety allowance or expert-confirmed physical limit. P1 rejects non-convergence; never certify an unfinished equilibrium solve."}} }
expert_rules = ["E13"]
open_question = [6]
description = "D61/C7 and D64/A5: equilibrium is checked every lift from arrival to final pre-departure state: upright floating equilibrium, fluid GM >= 0.15 m, absolute list <= max_list_rad, absolute trim <= Lpp * tan(maximum_trim_angle_rad), berth/load-line upper draughts and no lower draught bound. Open hatch immersion angle must exceed the list limit. At sampled states apply harbour BM per sign (permissible hog/sag plus 0.5 absolute wave moment of the same sign), seagoing still-water shear limits and static stack limits where operations are not load-only. Strength samples are hatch-cover events, bay completions, after last discharge, departure and top 3 surrogate ratios. A single ballast changeover k uses arrival then departure fills with HEEL-P/S pair-total-preserving transfers; report k. APPROXIMATION: the single total order of MovePlan.moves represents concurrent cranes; GM/list/trim/open-hatch/harbour/shear bounds, sampling, two-vector ballast and instantaneous changeover remain synthetic or borrowed. Seagoing GZ/weather, D40 trim window, lower forward draught, visibility and lashing are departure-only; departure retains full D57 checks. Feasibility uses only a sound necessary in-port screen and must not reject a checker-acceptable state; outside qualified linear domains it returns undecided. P1 numerical policy pins the scaled equilibrium residual tolerance, solver tolerances, bounded-solver function evaluations and liquid fixed-point iteration limit; non-convergence fails hard. Cross-reference stability.open_hatch_immersion: the same physical condition is reported there by strength for an actually immersed open coaming, while D64 P4 adds the strict immersion angle margin above the list limit (including deck edges). These are explained views of one flooding guard, not independent unexplained hazards."

[[rules]]
id = "stability.open_hatch_immersion"
title = "Open hatch coamings remain above the waterline"
source = "expert"
scope = "global"
hardness = "hard"
status = "provisional"
domain_rows = ["Displacement/draft within limits; GM ≥ minimum after free-surface correction", "Physical access: only the top box is reachable; below deck needs the hatch cover clear; ship stacks fill bottom-up"]
enforced_by = ["checker", "feasibility_engine", "solver"]
references = ["port.stability.cargo_operations", "docs/decisions.md: D64 P4", "docs/expert/2026-10-28-written-answers.md: Q6, 28 Oct 2026", "src/stowage/checker/strength.py: check_strength open-coaming guard", "src/stowage/checker/stability.py: _in_port_criteria"]
expert_rules = ["E13"]
open_question = [6]
description = "Global physical guard applies in port and seagoing states: every corner of an open hatch coaming must remain strictly above the waterline at actual floating equilibrium. An immersed or just-wetted lip fails under stability.open_hatch_immersion because flooded/open-hold buoyancy is not modelled; missing coaming geometry cannot certify a dry opening. This existing physical guard is active independently of rule-freeze-v1. Cross-reference port.stability.cargo_operations: when activated, D64 P4 reports the same physical condition through its aggregate id with an additional strict immersion angle margin above vessel.hull.max_list_rad, including deck edges and open coamings at equilibrium trim. The two ids describe actual immersion and the preventive angular margin, respectively; neither permits flooding. APPROXIMATION: D64's operating angular margin is synthetic; this catalogue addition changes no checker behaviour."
parameters = { operating_conditions = { value = ["port", "seagoing"], unit = "1", provenance = { assumption = "Existing strength checker open-coaming guard applies to either operating phase; global scope includes both." } }, minimum_coaming_clearance_m = { value = 0, unit = "m", provenance = { assumption = "Existing physical dry-opening boundary: waterline contact or immersion cannot use closed-coaming buoyancy." } }, strict_clearance = { value = true, unit = "1", provenance = { assumption = "Existing check rejects lip <= waterline, so clearance must be strictly positive." } }, activation_path = { value = "Existing physical strength guard whenever ShipState.covers_off is nonempty, in port or seagoing states; independent of activation.rule_freeze_v1. D64 angular-margin companion is gated by that switch through port.stability.cargo_operations.", unit = "1", provenance = { assumption = "Describe existing checker applicability without changing execution or activating D64." } } }

# D74: metadata stays visible but INACTIVE with rule-freeze-v1 off.
# Native model/design hours and hourly rates are explicit; all SI time conversions use 3600 s/h.
[[rules]]
id = "port.ballast.transfer_rate"
title = "Reported ballast delay and hard HEEL/pumping-window safety"
source = "port"
scope = "port"
hardness = "hard"
status = "provisional"
domain_rows = ["In-port ballast changeover pumping time and rate-limited HEEL split path"]
enforced_by = ["checker", "solver"]
references = ["docs/decisions.md: D74 specification, parameter amendment and user decision reporting R1 delay, 29 Oct 2026", "experiments/stability/in-port-criteria/DESIGN.md: Addendum B.1, B.2, B.3, B.5 and B.8 (rev 3.2)", "docs/decisions.md: D64 and D75", "experiments/review/w2/logic-d74.md", "https://www.marine-marchande.net/Voyage/Bruno/Henrike-Schepers/specification-container-feeders-800.pdf", "https://www.damen.com/vessels/cargo/container-feeders/container-feeder-800", "https://www.framo.com/media/azejuddh/framo-anti-heeling_system-brochure-small.pdf"]
description = "D74 is a plan-level port contract, reported separately from port.stability.cargo_operations. Under the 29 Oct user decision, R1 is reported ballast delay in hours per plan and per method, beside moves and outside the D11 objective: a positive delay causes no R1 violation or rejection. Hardness applies only to R2, the reachable rate-limited HEEL split path with exact re-evaluation of off-ideal splits, and the pumping-window stability checks. All actual pumping states, including waiting while cranes pause or departure is delayed, must pass the hard window checks at both endpoint fills with maximum worked-tank FSM; reporting delay never bypasses stability. It runs after the independent parallel per-state P1-P6 checks; it is not an additional per-state P-criterion. All methods use the same actual final lift order (D75), and the finisher still prefers the smallest P among candidates passing every hard check. The D64/D75 legacy unlimited-transfer/pump-time-not-modelled note is superseded only when this D74 contract is activated by the single shared rule-freeze-v1 switch. APPROXIMATION: amended rates, crane productivity, allowances and window/path surrogates are synthetic, UNVERIFIED pending expert Q23/Q30. Public Damen and Framo anti-heeling figures provide context, not verified ratings for our synthetic ships. APPROXIMATION: gravity draining is not modelled (conservative). This entry is inactive metadata with the switch off and changes no legacy rule semantics or execution."

[rules.parameters.evaluation_level]
value = "plan"
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8" }

[rules.parameters.activation_path]
value = "INACTIVE metadata while rule_freeze_v1_enabled() is false. Active only when the single activation.rule_freeze_v1 switch is true, for every operational current-port plan; no PortRuleRef opt-in. R2 HEEL path and all actual pumping-window states, including waiting, remain hard; R1 is reported delay only, with no R1 rejection. Missing operating parameters fail closed when active. Legacy off-state output and other rule semantics are unchanged."
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8" }

[rules.parameters.ballast_pump_m3_h]
profile_field = "vessel.ballast_system.ballast_pump_m3_h"
unit = "m^3/h"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md; experiments/review/w2/logic-d74.md", "clause" = "D74 parameter amendment, 29 Oct 2026; DESIGN Addendum B.2/B.8", "assumption" = "APPROXIMATION: synthetic, UNVERIFIED pending expert Q23/Q30. Amended ship profile values 500/700/1000 m^3/h for 500/800/1700; illustrative ranges 200-500/300-700/400-1000 m^3/h remain UNVERIFIED. The parameter amendment selected the lenient end of these ranges; the subsequent user decision reports R1 delay without rejection. Gravity draining is not modelled (conservative). These are source context, never catalogue fallbacks. Keep the native model unit; multiply time in seconds by 1/3600 to obtain hours." }

[rules.parameters.heel_transfer_m3_h]
profile_field = "vessel.ballast_system.heel_transfer_m3_h"
unit = "m^3/h"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md; experiments/review/w2/logic-d74.md; Damen Container Feeder 800 specification and Framo anti-heeling brochure", "clause" = "D74 parameter amendment, 29 Oct 2026; DESIGN Addendum B.2/B.8", "url" = "https://www.marine-marchande.net/Voyage/Bruno/Henrike-Schepers/specification-container-feeders-800.pdf", "assumption" = "APPROXIMATION: synthetic, UNVERIFIED pending expert Q23/Q30. Amended ship profile values 600/1000/1500 m^3/h for 500/800/1700. Public context: Damen CF800 anti-heeling system 1120 m^3/h; Framo commercial anti-heeling pumps 200-2200 m^3/h. This commercial context supersedes the obsolete vessel-specific HEEL bands; it does not verify our synthetic rates. Both public source URLs are in this rule's references and the logic review. Source context only, never fallback. R2 multiplies t_lift_s by 1/3600 before using this hourly rate." }

[rules.parameters.max_cranes]
profile_field = "vessel.ballast_system.max_cranes"
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md; experiments/review/w2/logic-d74.md", "clause" = "D74 parameter amendment, 29 Oct 2026; DESIGN Addendum B.2/B.8", "assumption" = "APPROXIMATION: synthetic, UNVERIFIED pending expert Q23/Q30. Profile maxima 2/2/3 cranes for 500/800/1700 are not runtime defaults. Working cranes are the minimum of this field and the existing canonical port.quay_crane.count." }

[rules.parameters.gross_moves_per_hour]
profile_field = "port.quay_crane.gross_moves_per_hour"
unit = "moves/h"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md; experiments/review/w2/logic-d74.md", "clause" = "D74 parameter amendment, 29 Oct 2026; DESIGN Addendum B.2/B.8", "assumption" = "APPROXIMATION: synthetic, UNVERIFIED pending expert Q23/Q30. Amended productivity is 25 gross moves/h per crane at main ports; 20 at small_feeder/cat_lai_like; illustrative range 20-35 remains UNVERIFIED. No public capacity source verified. More/faster cranes shorten nominal pumping time available and may increase reported R1 delay; they also reduce the per-lift time for the hard R2 HEEL path. R1 delay is not a rejection constraint." }

[rules.parameters.pre_operation_allowance_h]
profile_field = "port.quay_crane.pre_operation_allowance_h"
unit = "h"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md; experiments/review/w2/logic-d74.md", "clause" = "D74 parameter amendment, 29 Oct 2026; DESIGN Addendum B.2/B.8", "assumption" = "APPROXIMATION: synthetic, UNVERIFIED pending expert Q23/Q30. Amended A=1.0 h in profiles, illustrative range 0.25-1.5 h. Convert to seconds with 3600 s/h. This is a declared operating allowance, never an inferred wait or fallback." }

[rules.parameters.post_operation_allowance_h]
profile_field = "port.quay_crane.post_operation_allowance_h"
unit = "h"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md; experiments/review/w2/logic-d74.md", "clause" = "D74 parameter amendment, 29 Oct 2026; DESIGN Addendum B.2/B.8", "assumption" = "APPROXIMATION: synthetic, UNVERIFIED pending expert Q23/Q30. Amended B=1.0 h in profiles, illustrative range 0.25-1.0 h. Convert to seconds with 3600 s/h. Available only when k=n+1 and no in-port state requires departure ballast." }

[rules.parameters.port_cranes]
profile_field = "port.quay_crane.count"
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.2/B.8", "assumption" = "Existing canonical model count is the DESIGN count_per_berth quantity; any count_per_berth property is an alias, not an independent parameter. Use actual declared cranes working the ship subject to ship max_cranes." }

[rules.parameters.water_density_kg_m3]
profile_field = "port.water_density_kg_m3"
unit = "kg/m^3"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.2/B.8; D34", "assumption" = "Use actual declared port water density: ballast is taken from and returned to this harbour. Do not replace it by a fixed sea-water density or a tank content density." }

[rules.parameters.seconds_per_hour]
value = 3600
unit = "s/h"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8", "assumption" = "Exact unit conversion. Profile rates and allowances deliberately retain the design/model native m^3/h, moves/h and h units; every formula below explicitly converts seconds and hours." }

[rules.parameters.sequence_contract]
value = "Use the actual ordered plan after any shared terminal resequencing. Count every MovePlan.moves entry as one lift, including hatch-cover events; n is the number of entries and states run from s_0 to s_n."
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8; D75", "assumption" = "APPROXIMATION: D64/D75 one total crane order is shared identically by every method. This metadata does not reorder lifts or alter move counts." }

[rules.parameters.working_cranes_formula]
value = "n_c = min(port_cranes, max_cranes)"
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8" }

[rules.parameters.lift_time_formula]
value = "t_lift_s = 3600 / (gross_moves_per_hour * n_c)"
unit = "s"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74 user decision, 29 Oct 2026; DESIGN Addendum B.1/B.8", "assumption" = "Native gross crane moves per hour per crane. Higher productivity or concurrency reduces nominal pumping time available, potentially increasing reported R1 delay and tightening R2 per-lift HEEL reach. R1 delay never rejects a plan." }

[rules.parameters.pumped_mass_formula]
value = "P_kg = max(sum_positive_delta_kg, sum_negative_delta_kg), over non-HEEL adjustable tanks; delta_kg = m_dep_kg - m_arr_kg."
unit = "kg"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8", "assumption" = "R1 lower bound on water actually pumped. An internal transfer pumps each kg once, while intake and discharge each pump their own kg; do not substitute sum(abs(delta_kg)) for P." }

[rules.parameters.absolute_change_formula]
value = "abs_change_kg = sum(abs(delta_kg)) = sum_positive_delta_kg + sum_negative_delta_kg, over non-HEEL adjustable tanks."
unit = "kg"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74 user decision, 29 Oct 2026; DESIGN Addendum B.1/B.8", "assumption" = "Diagnostic total only; pump time and reported R1 ballast delay use P=max(sum_positive_delta_kg,sum_negative_delta_kg), not this larger total. Neither this diagnostic nor an R1 time overrun is a rejection constraint." }

[rules.parameters.pump_time_formula]
value = "tau_s = 3600 * P_kg / (water_density_kg_m3 * ballast_pump_m3_h)"
unit = "s"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8", "assumption" = "Equivalent native-hours formula tau_h = P_kg/(rho_port_kg_m3*R_ballast_m3_h). All comparisons use consistent units; 3600 converts the resulting hours to seconds." }

[rules.parameters.available_time_formula]
value = "T_s(k) = 3600 * A_h + k * t_lift_s + (3600 * B_h if k == n + 1 else 0)"
unit = "s"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74 user decision, 29 Oct 2026; DESIGN Addendum B.1/B.8", "assumption" = "A is the pre-operation allowance, B is post-operation. This is the nominal schedule reference for reported delay, not a hard pumping deadline. Departure ballast must physically be in place for any state using it; waiting for pumping does not waive its hard stability checks. Post-operation allowance is usable only if no in-port state needs departure ballast (k=n+1)." }

[rules.parameters.r1_pass_condition]
value = "tau_s <= T_s(k)"
unit = "1"
superseded_by = "ballast_delay_formula"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74 user decision, 29 Oct 2026; historical DESIGN Addendum B.1/B.8", "assumption" = "Historical compatibility diagnostic only; not a hard constraint, acceptance test or rejection condition. The active R1 contract reports ballast_delay_h through ballast_delay_formula." }

[rules.parameters.ballast_delay_formula]
value = "ballast_delay_h = max(0, (tau_s - T_s(k)) / 3600)"
unit = "h"
provenance = { "document" = "docs/decisions.md", "clause" = "D74 user decision, 29 Oct 2026", "assumption" = "Nonnegative extra pumping time beyond the nominal crane-plan allowance, converted from seconds to hours. Report per plan and per method; positive delay never emits an R1 violation or rejection." }

[rules.parameters.ballast_delay_reporting]
value = "Report ballast_delay_h in hours per plan and per method, beside moves. It is outside the D11 move objective; positive delay never emits an R1 violation or rejects a plan. R2 and actual pumping-window stability, including waiting states, stay hard."
unit = "1"
provenance = { "document" = "docs/decisions.md", "clause" = "D74 user decision, 29 Oct 2026; D11", "assumption" = "Operational waiting time is a reported quantity, not an objective penalty or an R1 safety rejection. Reporting delay never bypasses the hard stability checks during pumping." }

[rules.parameters.r1_delay_is_rejection]
value = false
unit = "1"
provenance = { "document" = "docs/decisions.md", "clause" = "D74 user decision, 29 Oct 2026", "assumption" = "R1 delay is reported only and cannot cause a changeover_time violation or any renamed R1 rejection." }

[rules.parameters.ballast_delay_in_objective]
value = false
unit = "1"
provenance = { "document" = "docs/decisions.md", "clause" = "D74 user decision, 29 Oct 2026; D11", "assumption" = "Report delay beside moves without adding it to the D11 objective or trading hard feasibility for less delay." }

[rules.parameters.pumping_window_formula]
value = "m = ceil(max(0, tau_s - 3600 * A_h) / t_lift_s) is an equivalent-lift duration. Hard checks cover actual pumping states, including waiting, at arrival and departure endpoint fills with maximum worked-tank FSM. If m exceeds the preceding lifts, no fictitious pre-arrival or negative-index states are implied. For k=n+1 the nominal reference also includes B."
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74 user decision, 29 Oct 2026; DESIGN Addendum B.1/B.8", "assumption" = "APPROXIMATION: all actual pumping states, including waiting, must pass P1-P6 at both endpoint fills with maximum FSM for changed tanks. Near-linear trim/list/draught and that FSM charge stand in for checking every intermediate fill; mild KM(draught) nonlinearity is not searched. Equivalent-lift accounting does not define a waiting scheduler or create pre-arrival states. Pass-1 k remains candidate-independent; delay reporting cannot bypass stability." }

[rules.parameters.pumping_window_waiting_states_hard]
value = true
unit = "1"
provenance = { "document" = "docs/decisions.md", "clause" = "D74 user decision, 29 Oct 2026", "assumption" = "Every actual state used during pumping, including waiting for cranes or departure, remains subject to hard pumping-window stability checks at both endpoint fills with maximum worked-tank FSM. This contract does not prescribe a future waiting-scheduling algorithm." }

[rules.parameters.pumping_window_endpoint_fills]
value = ["arrival", "departure"]
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8" }

[rules.parameters.worked_tanks_maximum_fsm]
value = true
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8", "assumption" = "The changed tanks are being worked: charge maximum FSM in both endpoint checks and re-run arrival-fill window states with that charge." }

[rules.parameters.heel_step_formula]
value = "delta_kg = water_density_kg_m3 * heel_transfer_m3_h * t_lift_s / 3600"
unit = "kg"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8", "assumption" = "R2 hourly HEEL rate must be converted using t_lift_s/3600 h; omitting 1/3600 would overstate per-lift pump authority by 3600." }

[rules.parameters.heel_initial_reach_formula]
value = "Reach_0 = [s_arr_kg - rho_port_kg_m3 * R_heel_m3_h * A_h, s_arr_kg + rho_port_kg_m3 * R_heel_m3_h * A_h] intersect [lo_0, hi_0]"
unit = "kg"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8", "assumption" = "Arrival split is declared by the generator; the assumed 50/50 pre-fill is not set by this rule or by the catalogue. Initial allowance A is already in hours." }

[rules.parameters.heel_reach_formula]
value = "Reach_i = (Reach_(i-1) + [-delta_kg, delta_kg]) intersect [lo_i, hi_i]"
unit = "kg"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8" }

[rules.parameters.heel_path_method]
value = "R2 passes iff every Reach_i is nonempty. A forward-backward sweep computes the feasible band and chooses the feasible split closest to each unconstrained ideal."
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8", "assumption" = "APPROXIMATION: admissible intervals use list linearisation at equilibrium GM_fluid with exact endpoint verification. A missed feasible path is a false rejection reported as heel_path_linearised_miss; every used off-ideal split is rechecked exactly, never accepted solely from linearisation." }

[rules.parameters.heel_path_exact_recheck]
value = true
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8", "assumption" = "Re-evaluate every chosen split differing from the ideal with the exact state check, in parallel. A physical failure belongs to port.stability.cargo_operations, not the pump-rate diagnostic." }

[rules.parameters.heel_total_preserved_at_changeover]
value = true
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8", "assumption" = "D64 HEEL total is unchanged at k, so the constrained HEEL path is continuous through the single changeover; only the split varies." }

[rules.parameters.exact_recheck_failure_rule]
value = "port.stability.cargo_operations"
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.1/B.8" }

[rules.parameters.rate_violation_codes]
value = ["heel_step"]
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74 user decision, 29 Oct 2026; DESIGN Addendum B.1/B.8", "assumption" = "Only R2 HEEL rate/path failure emits a rate violation. Pumping-window physical failures use the existing port.stability.cargo_operations rule; R1 delay emits no violation code." }

[rules.parameters.reported_metrics]
value = ["changeover_k", "lifts_after_k", "pumped_mass_t", "abs_change_t", "pump_time_required_h", "pump_time_available_h", "ballast_delay_h", "pump_window_lifts", "ballast_pump_m3_h", "t_lift_s", "cranes", "gross_moves_per_hour", "heel_step_limit_t", "heel_max_step_t", "heel_max_ideal_step_t", "heel_path_feasible", "heel_path_linearised_miss", "rate_check_rule"]
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74 user decision, 29 Oct 2026; DESIGN Addendum B.3/B.8", "assumption" = "Reports retain the DESIGN names and add ballast_delay_h in hours per plan and per method, beside moves and outside the D11 objective. Convert internal kg to t by /1000 and seconds to h by /3600; reports never change the physical formula units. R1 delay is not a rule violation." }

[rules.parameters.finisher_rate_margin_formula]
value = "c_rate = (C_kg - P_kg) / C_kg, where C_kg = water_density_kg_m3 * ballast_pump_m3_h * T_s(k) / 3600"
unit = "1"
superseded_by = "ballast_delay_formula"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74 user decision, 29 Oct 2026; historical DESIGN Addendum B.5/B.8", "assumption" = "Historical compatibility diagnostic only; not a hard constraint, search bound or acceptance condition. A negative historical margin never rejects a candidate. The active R1 contract reports ballast_delay_h; exact pumping-window, suffix and R2 safety checks remain mandatory." }

[rules.parameters.finisher_preference]
value = "Among candidates passing every exact check prefer the smallest P; seed order arrival fills, D58 witness, berth witness, LP seed with minimum P."
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74 user decision, 29 Oct 2026; DESIGN Addendum B.5/B.8; D11", "assumption" = "The finisher still prefers the smallest P among candidates passing all hard safety checks. R1 delay is reported beside moves and is not a search constraint or part of the D11 objective. R2 and pumping-window checks remain hard; the pumped-mass preference is subordinate to hard feasibility." }

[rules.parameters.mask_screens_pump_rates]
value = false
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74 user decision, 29 Oct 2026; DESIGN Addendum B.5/B.8", "assumption" = "The mask stays necessary and does not screen pump rates. The whole-plan checker/finisher reports R1 delay without rejection and owns hard R2 and pumping-window checks; no feasibility-engine rate enforcement is claimed." }

[rules.parameters.missing_parameter_policy]
value = "When active, missing declared operating rates/counts/allowances or non-operational unknown limits fail closed; never infer zero pumping cost or use synthetic catalogue fallback values."
unit = "1"
provenance = { "document" = "docs/decisions.md and experiments/stability/in-port-criteria/DESIGN.md", "clause" = "D74; DESIGN Addendum B.2/B.8", "assumption" = "Model/loader optional fields preserve saved off-state inputs. Operational rate validation belongs to the activated checker/finisher, not this metadata loader." }

