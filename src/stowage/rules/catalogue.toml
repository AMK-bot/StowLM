[[rules]]
id = "port.dg.refused_class"
title = "Port-refused dangerous-goods classes"
source = "expert"
scope = "port"
hardness = "hard"
status = "provisional"
domain_rows = ["Stowage categories and special provisions (e.g. on deck only, away from living quarters, protected from heat)"]
enforced_by = ["checker", "feasibility_engine", "solver"]
references = ["docs/expert/2026-10-28-written-answers.md: 28 Oct 2026", "experiments/fleet/orders/w2-x1-contract.md", "docs/decisions.md: D61 / D62", "docs/decisions.md: D66", "experiments/fleet/orders/w2-x1-contract.md: Addendum 1 A3-A4", "IMDG Code Amendment 42-24: 2.0.3"]
parameters = { "classes" = { "profile_field" = "port.port_rules", "unit" = "1", "provenance" = { "document" = "Expert written answers, 28 Oct 2026", "clause" = "Q9", "assumption" = "Expert Q9, 28 Oct 2026: select the matching PortRuleRef.params.classes for this rule id; Laem Chabang-like value is [7]. No rule ref means no port-specific class restriction." } }, "include_subsidiary_risks" = { "value" = false, "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D66", "assumption" = "D66/Addendum 1 A4: primary class only; subsidiary risks and recursive DangerousGoods.additional declarations do not trigger this port rule." } }, "activation_path" = { "value" = "activation.rule_freeze_v1 = true AND matching PortRuleRef in the resolved current/later PortProfile.port_rules; no matching rule ref means no restriction. Later calls resolve from PortCall.archetype.", "unit" = "1", "provenance" = { "document" = "docs/decisions.md", "clause" = "D61/D62/D64; Addendum 1 A3-A5", "assumption" = "Addendum 1 A5: explicit activation route; legacy port rules remain active while new D61/D62/D64 rules are gated." } } }
expert_rules = ["E12"]
open_question = [9]
description = "D61/C5 and D66/A4: primary class only. Primary class 7 is refused for loading, discharge or restow at this port; generators exclude it for POL, POD and transshipment calls. IMDG 2.0.3 gives class 7 precedence, so class 7 is never a subsidiary risk; no recursive compound-declaration expansion applies. A box staying on board without handling is not refused by C5 as written; expert follow-up Q27 remains open. Resolve later calls from PortCall.archetype and check the destination/transshipment profile at POL; D63 reclassification stays deferred."

