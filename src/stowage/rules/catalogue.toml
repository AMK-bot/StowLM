# Rule catalogue. Entries remain provisional where numeric policies need verification.
# Hard means every departure condition and every applicable new placement must pass;
# a better move count never buys a violation. Physical access must hold for every move.
# Soft entries rank margins and heavy-under-deck preference AFTER hard feasibility,
# full feasible intake and minimum move count (D11); they have no safety waiver.
# Tolerated-if-inherited is still hard for new placements: Stage B may leave an
# already-on-board preference violation alone, only for entries explicitly tagged
# that way. It never waives stability, strength, stack mass, DG or lashing safety.
# SI values: kg, m, rad, N, N*m, m*rad, N/m, N/m^2; unit "1" means a count,
# fraction, boolean, symbolic table name or dimensionless classification.
# Profile fields resolve against the frozen pydantic Instance, Vessel and PortProfile.
# Dotted paths traverse each element of lists (e.g. vessel.stacks.max_mass_kg).
# instance.rule_overrides means lookup [rule.id][parameter name], not the whole map;
# each entry names those keys in provenance. Units describe the selected/derived value.
# Provenance explains derivations where the field supplies geometry or table samples.
# Profile values carry their own synthetic/public provenance. D25 permits the
# provisional class defaults. Legacy ship consumers still use these until L2;
# D61 actual-kg parameters and pending contracts are additive L1 metadata.
# D32 similarly supplies provisional E8 heat and E9 OOG clearances (Q12/Q13).
# Shared weight_classes.parameters owns the boundaries; shared_parameter references
# are materialised into Parameter.value by the loader for all consumers.
# E1/E2 weight_order_tolerance_kg is zero: equal masses are allowed, inversions are not.
# References to IMDG tables name task 1.3 data; no segregation cells live here.
# Regulatory URLs and source-version caveats are in docs/data-sources.md section 4.
# These records describe required enforcement locations, not implemented coverage.
# Recommendatory IS B2.3 is adopted as a hard project second check when applicable.
# IRS source is grouped as IACS member guidance, not misrepresented as an IACS UR.
# APPROXIMATION: lashing demand remains approximate under D2; see its entry.

schema_version = 1

# One switch for every D61/D62/D64 execution consumer. The leader flips it only
# after reviewed L2-L4 and mask migration; legacy behaviour remains active while off.
# Read through catalogue.rule_freeze_v1_enabled(); test with rule_freeze_v1(enabled=True).
# The test helper overrides the whole effective snapshot/SHA without editing this file.
[activation]
rule_freeze_v1 = false

[weight_classes]
status = "provisional"
open_question = [2, 4, 11]

[weight_classes.parameters.labels]
value = ["L", "M", "H"]
unit = "1"
provenance = { assumption = "D25 provisional class order by VGM, pending expert Q2/Q4/Q11; labels are ranked light to heavy." }

[weight_classes.parameters.medium_min_kg]
value = 10000
unit = "kg"
provenance = { assumption = "D25 provisional inclusive lower bound for M, pending expert Q2/Q4/Q11: L < 10000 kg <= M." }

[weight_classes.parameters.heavy_min_kg]
value = 20000
unit = "kg"
provenance = { "assumption" = "D25 synthetic inclusive lower bound for H: M < 20000 kg <= H; no numeric threshold was confirmed in expert Q11. This shared boundary serves yard clustering and active legacy E1/E2/legacy E6 until activation.rule_freeze_v1. The pending E6 heavy_on_deck_threshold_kg is independent." }

