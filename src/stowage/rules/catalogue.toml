[[rules]]
id = "expert.rotation.no_overstow"
title = "Current rotation access and projected restow accounting"
source = "expert"
scope = "global"
hardness = "hard"
status = "provisional"
domain_rows = ["Earlier-port discharges must be physically accessible, directly or through explicitly planned, legal and counted restows"]
enforced_by = ["checker", "feasibility_engine", "solver"]
references = ["docs/domain.md: Constraint catalogue", "docs/data-sources.md: section 4"]
parameters = { "discharge_order" = { "unit" = "1", "provenance" = { "assumption" = "Instance rotation defines ordering; identical POD does not cause an overstow." }, "value" = "instance.rotation.calls.index" } }
description = "Current-call replay rejects physically inaccessible discharges and illegal restow returns. APPROXIMATION: D15 adds the minimum forced restow-lift count under its fixed-departure-stow, no-future-load counting scenario to the D11 move objective. These abstract future counts do not construct supported return positions or certify an executable future policy, and are not a minimum over arbitrary executable plans. Stage B executable future restows (10.4/11.2) remain unimplemented; future blockers are currently counted rather than rejected for absence of an explicit future sequence. Hard current-call access and safety rules still apply."
open_question = [1, 4]

