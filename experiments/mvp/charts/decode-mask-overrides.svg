<text x="54" y="617" font-size="18" fill="#17212b" text-anchor="start" font-weight="normal">This measures intervention by the decode mask, not correctness of the model&#x27;s reading.</text>
<text x="54" y="643" font-size="17" fill="#17212b" text-anchor="start" font-weight="normal">End-token swaps are excluded; the same 200-sentence validation sample is used in both arms.</text>
