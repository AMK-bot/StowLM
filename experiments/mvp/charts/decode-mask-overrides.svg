<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Decode-mask overrides before and after fine-tuning</title>
<desc id="desc">Recorded validation study, not sealed accuracy. Almost all overrides concerned output format; neither arm had an illegal bay or tier. Both remaining overrides concerned sentences the reader should have refused.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif} line,rect,circle,path{vector-effect:non-scaling-stroke}</style>
<rect width="1200" height="720" fill="#ffffff"/>
<metadata id="chart-data">{&quot;facts&quot;: {&quot;fine_tuned&quot;: {&quot;count&quot;: 200, &quot;overrides&quot;: 2}, &quot;untrained&quot;: {&quot;count&quot;: 200, &quot;overrides&quot;: 182}}, &quot;sources&quot;: [{&quot;path&quot;: &quot;experiments/mvp/reader/v3/results-final/mask-study/report-base.json&quot;, &quot;sha256&quot;: &quot;795009c1dc3e277365279adc5902860a2eab847b0ab1f08c37b1d768976bc077&quot;}, {&quot;path&quot;: &quot;experiments/mvp/reader/v3/results-final/mask-study/report.json&quot;, &quot;sha256&quot;: &quot;4774b875747953fbd1dd7652e3ed12ec04d905545c937baa40e300f95ec84173&quot;}, {&quot;path&quot;: &quot;docs/headline.md&quot;, &quot;sha256&quot;: &quot;48f8315729481c665f15807dc468911ac313ad7f71a07bad5e505573348f3d06&quot;}]}</metadata>
<text x="36" y="46" font-size="28" fill="#17212b" text-anchor="start" font-weight="bold">Decode-mask overrides before and after fine-tuning</text>
<text x="36" y="79" font-size="17" fill="#17212b" text-anchor="start" font-weight="normal">Validation sentences; recorded results. Synthetic ships and cargo, simulated port.</text>
<text x="36" y="112" font-size="18" fill="#17212b" text-anchor="start" font-weight="bold">almost all were the output format, not ship facts; none was an illegal bay or tier</text>
<text x="36" y="145" font-size="18" fill="#17212b" text-anchor="start" font-weight="bold">both of the 2 were sentences it should have refused; what&#x27;s left is legal and still wrong,</text>
<text x="36" y="173" font-size="18" fill="#17212b" text-anchor="start" font-weight="bold">which is why a person confirms.</text>
<text x="36" y="208" font-size="17" fill="#17212b" text-anchor="start" font-weight="normal">A sentence is counted when the mask overrode the model&#x27;s first choice at least once.</text>
