window_before_cutoff_s = { value = 345600, unit = "s", assumption = "Synthetic local-export receiving window; expert Q5/Q8 pending." }
cutoff_before_arrival_s = { value = 43200, unit = "s", assumption = "Synthetic cutoff preceding scheduled arrival; expert Q5/Q8 pending." }

[[gate_in.bins]]
