end_before_cutoff_s = { value = 259200, unit = "s", assumption = "Synthetic local-export arrivals uniform inside [end,start) seconds before cutoff; shares partition window; expert Q5/Q8 pending." }
share = { value = 0.1, unit = "fraction", assumption = "Synthetic local-export arrivals uniform inside [end,start) seconds before cutoff; shares partition window; expert Q5/Q8 pending." }

