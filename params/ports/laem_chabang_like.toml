# APPROXIMATION: operational scenarios are synthetic; expert Q3/Q9 limits and public berth-depth anchors are sourced below.
# Public port/equipment context is listed in README; it does not validate these scenario values.
# Bays count twenty-foot longitudinal positions; forty-foot boxes occupy two adjacent positions.
# Clearance height is an assumed equipment travel envelope, never an extra storage tier.
id = "laem_chabang_like"
label = "Laem Chabang-like gateway"
description = "Synthetic Thai gateway berth group with exports, imports and minority vessel-to-vessel transfers; no real terminal is reproduced. yard height 5, synthetic RTG; quay crane H = 8, expert Q3."
synthetic = true
schema_version = { value = 1, unit = "version", assumption = "Initial local parameter schema version." }
max_crane_height_tiers = { value = 8, unit = "tiers", source = { document = "docs/expert/2026-10-28-written-answers.md", question = "Q3", says = "Expert Q3 (28 Oct 2026): most Laem Chabang terminals can operate eight tiers; applied to the quay crane only under D62 amendment/A8. Yard height is an independent synthetic RTG assumption pending Q25.", read_date = "2026-10-28" } }
berthing_side = "port"
berthing_side_assumption = "ASSUMPTION: synthetic port-side berthing default; no berth survey is supplied."
port_rules = [{ rule_id = "port.dg.refused_class", params = { classes = ["7"] } }, { rule_id = "port.dg.direct_delivery", params = { classes = ["1"] } }]
port_rules_source = "Expert Q9, 28 Oct 2026: class 7 is not handled; class 1 is delivered/picked up at ship side. docs/expert/2026-10-28-written-answers.md"

berth_depth_m = { value = 16, unit = "m", source = { url = "https://hutchisonports.co.th/facilities/", says = "Hutchison Ports Thailand facilities: current C1/C2 and D terminals list depth at mean sea level of 16 m; the port overview separately labels the 18 m Phase 3 design as future development. This source anchors a synthetic representative berth, not every Laem Chabang berth.", read_date = "2026-10-29" } }
berth_depth_assumption = "APPROXIMATION: representative synthetic berth; any published depth is context for this scenario, not measured permission at every berth. With rule freeze v1 on, depth is used directly as PortProfile.max_draught_m. No tide or UKC increment is credited; no separate UKC reserve is modelled. Unknown legacy limits remain None with the switch off."

[yard]
truck_lane_side = "low"
truck_lane_side_assumption = "ASSUMPTION: synthetic lane at the row-1 side of every block; no yard survey is supplied."
berth_count = { value = 2, unit = "berths", assumption = "Synthetic selected berth group, not the whole reference port; geometry chosen to support several simultaneous calls." }
block_count = { value = 12, unit = "blocks", assumption = "Synthetic selected berth group, not the whole reference port; geometry chosen to support several simultaneous calls." }
blocks_per_berth = { value = 6, unit = "blocks/berth", assumption = "Synthetic selected berth group, not the whole reference port; geometry chosen to support several simultaneous calls." }
bays_per_block = { value = 24, unit = "bays", assumption = "Synthetic selected berth group, not the whole reference port; geometry chosen to support several simultaneous calls." }
rows_per_bay = { value = 6, unit = "rows", assumption = "Synthetic selected berth group, not the whole reference port; geometry chosen to support several simultaneous calls." }
max_stack_tiers = { value = 5, unit = "tiers", assumption = "ASSUMPTION: yard height 5, synthetic RTG; independent of quay crane H under D62 amendment/A8. Pre-L1 yard limit retained with the switch on or off; real yard height remains pending expert Q25." }
initial_occupancy_fraction = { value = 0.6, unit = "fraction", assumption = "Synthetic selected berth group, not the whole reference port; geometry chosen to support several simultaneous calls." }

[equipment]
type = "RTG"
stacking_notation = "synthetic RTG; yard height 5"
stack_height_tiers = { value = 5, unit = "tiers", assumption = "ASSUMPTION: yard height 5, synthetic RTG; storage limit independent of quay crane H under D62 amendment/A8. Pre-L1 storage value retained with the switch on or off; real RTG capacity remains pending expert Q25." }
clearance_height_tiers = { value = 6, unit = "tiers", assumption = "ASSUMPTION: informational legacy synthetic RTG clearance quantity only; expert Q3 does not supply measured yard hook height. Not an operational crossing threshold or an extra storage tier." }
count = { value = 12, unit = "machines", assumption = "Synthetic selected berth group, not the whole reference port; geometry chosen to support several simultaneous calls." }

[quay_crane]
gross_moves_per_hour = { value = 25, unit = "moves/h/crane", assumption = "APPROXIMATION: synthetic D74 amended per-crane gross productivity; UNVERIFIED range 20-35 moves/h/crane, selected 25; pending expert Q23/Q30, not a measured terminal rate." }
pre_operation_allowance_h = { value = 1.0, unit = "h", assumption = "APPROXIMATION: synthetic D74 amended pre-operation pumping allowance; UNVERIFIED range 0.25-1.5 h, selected 1.0 h; pending expert Q23/Q30." }
post_operation_allowance_h = { value = 1.0, unit = "h", assumption = "APPROXIMATION: synthetic D74 amended post-operation pumping allowance; UNVERIFIED range 0.25-1.0 h, selected 1.0 h; pending expert Q23/Q30." }
max_on_deck_tier_count = { value = 8, unit = "tiers", source = { document = "docs/expert/2026-10-28-written-answers.md", question = "Q3", says = "Expert Q3 (28 Oct 2026): most Laem Chabang terminals can operate eight tiers; applied to the quay crane only under D62 amendment/A8. Yard height is an independent synthetic RTG assumption pending Q25.", read_date = "2026-10-28" } }
count_per_berth = { value = 2, unit = "cranes/berth", assumption = "Synthetic selected berth group, not the whole reference port; geometry chosen to support several simultaneous calls." }

[traffic]
transshipment_fraction = { value = 0.1, unit = "fraction", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput. Fraction of discharged boxes reserved for later vessel loading, matched to load demand." }
mean_teu_per_box = { value = 1.6, unit = "TEU/box", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput. Cargo-mix prior; actual box size determines physical occupancy." }

[[services]]
id = "regional_feeder"
kind = "feeder"
calls_per_week = { value = 7, unit = "calls/week", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput." }
mean_load_boxes = { value = 300, unit = "boxes/call", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput." }
mean_discharge_boxes = { value = 280, unit = "boxes/call", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput." }
call_volume_cv = { value = 0.25, unit = "dimensionless", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput." }
arrival_jitter_s = { value = 10800, unit = "s", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput. Uniform signed jitter about scheduled arrival; value is half-width." }

[[services]]
id = "regional_mainline"
kind = "mainline"
calls_per_week = { value = 3, unit = "calls/week", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput." }
mean_load_boxes = { value = 800, unit = "boxes/call", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput." }
mean_discharge_boxes = { value = 820, unit = "boxes/call", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput." }
call_volume_cv = { value = 0.25, unit = "dimensionless", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput." }
arrival_jitter_s = { value = 10800, unit = "s", assumption = "Synthetic selected-berth workload; expert Q8 to confirm call volumes and frequency; not scaled from whole-port throughput. Uniform signed jitter about scheduled arrival; value is half-width." }

[gate_in]
process = "piecewise_uniform_before_cutoff"
window_before_cutoff_s = { value = 345600, unit = "s", assumption = "Synthetic export gate-in pattern rising toward cutoff; expert Q5/Q8 to confirm." }
cutoff_before_arrival_s = { value = 21600, unit = "s", assumption = "Synthetic export gate-in pattern rising toward cutoff; expert Q5/Q8 to confirm." }

