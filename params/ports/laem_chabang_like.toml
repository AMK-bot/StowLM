[dwell]
distribution = "gamma"
import_mean_s = { value = 345600, unit = "s", assumption = "Synthetic gamma dwell distribution; expert Q5/Q8 to confirm times and variability." }
import_cv = { value = 0.65, unit = "dimensionless", assumption = "Synthetic gamma dwell distribution; expert Q5/Q8 to confirm times and variability." }
transshipment_mean_s = { value = 172800, unit = "s", assumption = "Synthetic gamma dwell distribution; expert Q5/Q8 to confirm times and variability." }
transshipment_cv = { value = 0.5, unit = "dimensionless", assumption = "Synthetic gamma dwell distribution; expert Q5/Q8 to confirm times and variability." }

[placement]
cluster_keys = ["vessel_call_id", "pod", "size_type", "weight_class"]
preferred_stack_order = "later_retrieval_below_earlier_retrieval"
noise_model = "independent_cluster_and_order_errors"
cluster_misplacement_probability = { value = 0.15, unit = "fraction", assumption = "Synthetic imperfect good-enough placement following provisional E4; expert Q5 to confirm clustering and noise." }
retrieval_order_error_probability = { value = 0.2, unit = "fraction", assumption = "Synthetic imperfect good-enough placement following provisional E4; expert Q5 to confirm clustering and noise." }

[simulation]
call_arrival_process = "weekly_schedule_with_uniform_jitter"
volume_distribution = "negative_binomial"
overflow_policy = "hold_in_external_queue"
import_exit_process = "sample_dwell_at_discharge"
transshipment_connection_policy = "next_compatible_call_after_dwell"

# A1/A8: legacy quay cap applies only while the switch is off; yard storage stays five in both regimes.
[legacy_height_limits]
yard_max_tiers = { value = 5, unit = "tiers", assumption = "ASSUMPTION: yard height 5, synthetic RTG; retained with the switch on or off under A8; real yard height pending expert Q25." }
equipment_stack_tiers = { value = 5, unit = "tiers", assumption = "ASSUMPTION: yard height 5, synthetic RTG; pre-L1 storage value retained with the switch on or off under A8; real RTG capacity pending expert Q25." }
equipment_clearance_height_tiers = { value = 6, unit = "tiers", assumption = "ASSUMPTION: informational legacy synthetic RTG clearance quantity; never the yard crossing threshold or an extra storage tier; measured hook height unverified." }
quay_max_on_deck_tiers = { value = 7, unit = "tiers", assumption = "ASSUMPTION: legacy synthetic quay limit before D62 activation; expert Q3 pending in the legacy regime." }
equipment_stacking_notation = "synthetic RTG; yard height 5"
