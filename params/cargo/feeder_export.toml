# APPROXIMATION: synthetic public-context-informed feeder cargo, not measured bookings.
schema_version = { value = 1, unit = "dimensionless", assumption = "Initial schema revision." }
profile_id = "synthetic_laem_chabang_feeder_exports"
rating_policy = "Selected equipment example ratings, not universal ISO length maxima. Actual CSC plate, vessel, stack, lashing and port limits remain binding."
[sampling]
order = "Select rotation per call; per box select equipment, empty/full and POD; then OOG, DG and E8; weight last."
weight_dependence = "Draw equipment triangular gross g. Loaded gross = tare + (g - tare) * POD payload_weight_multiplier. Clip to [loaded min, min(loaded max, max_gross_kg)]. Clipping creates boundary atoms. Reefer dependence comes from equipment-specific weights. Empty mass is tare, ignoring POD."
independence = "POD independent of equipment and empty state. Event draws independent conditional on eligibility; no other calibrated correlations."
empty_policy = "Empty boxes carry no DG, E8 or OOG. Empty reefer unpowered; loaded reefer requires power. Empty mass point value is tare."
dg_policy = "One declared substance per selected eligible loaded dry box, then class and UN draw. No DG on reefer, empty or flat rack. Retrieve full IMDG attributes by UN, including subsidiary hazards and compatibility group; frequencies never override rules."
e8_policy = "One extra request per selected loaded NON-OOG box. Requests add to mandatory DG/reefer rules. Reject and record infeasible combinations, never relax constraints."
oog_policy = "Only loaded flat rack eligible. Envelope = equipment exterior plus overhangs. Width applies both sides, length both ends. Checker decides slot blocking, securing and permitted stowage."
feasibility_policy = "Record intended and realised distributions plus conditioning/rejections for 45-foot support, plugs, DG, OOG, vessel and port limits; never silently convert special cargo to dry."
onboard_policy = "Stage B input includes rotation ID and current zero-based call index. Eligible destination occurrences have call index strictly greater than current index. Retain only rotation PODs with such occurrences; choose first subsequent occurrence for each POD, renormalise retained box shares, and record conditioning. Empty eligible set is an explicit error. This is a synthetic initial onboard model, not fitted survival or cargo-age data. Never alter inherited cargo."
[vgm]
authority = "SOLAS VI/2 requires packed-container VGM before loading. Whole weighing or summed contents including dunnage plus tare. MSC.1/Circ.1475 section 10.1 bars gross over CSC plate maximum. No universal numeric minimum or tolerance is supplied by SOLAS."
url = "https://wwwcdn.imo.org/localresources/en/OurWork/Safety/Documents/MSC.1%20Circ.1475.pdf"
locator = "sections 5, 9, 10.1"
read_date = "2026-10-27"
synthetic_policy = "Synthetic drawn gross is treated as exact verified input; no metrology or misdeclaration model."

