<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 958" width="1280" height="958" role="img" aria-labelledby="t d">
  <title id="t">StowLM pipeline</title>
  <desc id="d">Voyage documents go to Muse Spark and a planner's spoken words to Muse Voice Transcribe; StowLM Reader, a Muse Glimmer 30B model we fine-tuned locally with LoRA and decode through a feasibility mask on the laptop, reads the words into rules; the planner confirms the reading; Frontier Engine 0.13.0, the reference engine in the engine slot, plans; the full checker decides; a signed handover package comes out. Each software component says how it was developed. All of it is packaged as one app, StowLM user software, for stowage planners and terminal teams.</desc>
  <style>
    svg { --bg:#ffffff; --ink:#0f172a; --muted:#475569; --line:#64748b; --frame:#94a3b8;
          --cloud-bg:#fff7ea; --cloud:#b45309; --dev-bg:#ecfdf5; --dev:#047857;
          --sw-bg:#f1f5f9; --sw:#334155; --fig-bg:#ffffff; --tab:#e2e8f0; }
    text { font-family: -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .h { font-size: 20px; font-weight: 700; }
    .hb { font-size: 24px; font-weight: 800; }
    .k { font-size: 13px; font-weight: 700; letter-spacing: .06em; }
    .kb { font-size: 15px; font-weight: 800; letter-spacing: .06em; }
    .s { font-size: 15px; fill: var(--muted); }
    .s2 { font-size: 14px; fill: var(--muted); }
    .d { font-size: 14px; font-weight: 700; fill: var(--ink); }
    .f { font-size: 15px; }
    .fb { font-size: 15px; font-weight: 700; }
    .tab { font-size: 16px; font-weight: 700; }
    .note { font-size: 14px; fill: var(--muted); }
    .bg { fill: var(--bg); }
    .win { fill: var(--bg); stroke: var(--sw); stroke-width: 2.5; }
    .winline { fill: none; stroke: var(--sw); stroke-width: 2.5; }
    .bar { fill: var(--tab); }
    .dot { fill: var(--frame); }
    .app { font-size: 19px; font-weight: 800; }
    .in { fill: var(--sw-bg); stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .cloud { fill: var(--cloud-bg); stroke: var(--cloud); stroke-width: 2; }
    .dev { fill: var(--dev-bg); stroke: var(--dev); stroke-width: 3; }
    .sw { fill: var(--sw-bg); stroke: var(--sw); stroke-width: 2; }
    .fig { fill: var(--fig-bg); stroke: var(--dev); stroke-width: 1.2; }
    .kc { fill: var(--cloud); } .kd { fill: var(--dev); } .ks { fill: var(--sw); }
    .arrow { fill: none; stroke: var(--line); stroke-width: 2.4; marker-end: url(#a); }
    .head { fill: var(--line); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="958"/>
  <text class="hb" x="40" y="40">StowLM pipeline</text>

  <!-- the app window: everything below is packaged as one piece of software -->
  <rect class="win" x="24" y="60" width="1232" height="874" rx="14"/>
  <path class="bar" d="M25.25,104 L25.25,74 Q25.25,61.25 38,61.25 L1242,61.25 Q1254.75,61.25 1254.75,74 L1254.75,104 Z"/>
  <path class="winline" d="M24,104 L1256,104"/>
  <circle class="dot" cx="50" cy="82" r="6"/>
  <circle class="dot" cx="70" cy="82" r="6"/>
  <circle class="dot" cx="90" cy="82" r="6"/>
  <text class="app" x="114" y="89">StowLM user software</text>
  <text class="note" x="1236" y="88" text-anchor="end">one app for stowage planners and terminal teams</text>

  <g transform="translate(0,40)">
  <!-- inputs -->
  <rect class="in" x="48" y="104" width="210" height="96" rx="10"/>
  <text class="k ks" x="62" y="128">INPUT</text>
  <text class="h" x="62" y="152">Planner's words</text>
  <text class="s" x="62" y="174">typed, or called over</text>
  <text class="s" x="62" y="192">a bad radio line</text>

  <rect class="in" x="48" y="250" width="210" height="110" rx="10"/>
  <text class="k ks" x="62" y="274">INPUT</text>
  <text class="h" x="62" y="298">Voyage documents</text>
  <text class="s" x="62" y="320">booking papers, photos,</text>
  <text class="s" x="62" y="338">emails (synthetic)</text>

  <!-- cloud models -->
  <rect class="cloud" x="300" y="104" width="270" height="96" rx="10"/>
  <text class="k kc" x="314" y="128">META MODEL API · CLOUD</text>
  <text class="h" x="314" y="152">Muse Voice Transcribe</text>
  <text class="s" x="314" y="174">speech to an editable transcript;</text>
  <text class="s" x="314" y="192">typed words skip this step</text>

  <rect class="cloud" x="300" y="228" width="270" height="172" rx="10"/>
  <text class="k kc" x="314" y="252">META MODEL API · CLOUD</text>
  <text class="h" x="314" y="276">Muse Spark</text>
  <text class="s" x="314" y="298">reads the cargo papers, one call</text>
  <text class="s" x="314" y="316">per booking; finds where</text>
  <text class="s" x="314" y="334">documents disagree; copilot</text>
  <text class="s" x="314" y="352">picks checked tools.</text>
  <text class="s" x="314" y="376">Also wrote 1,228 of the</text>
  <text class="s" x="314" y="394">reader's training sentences</text>

  <!-- reader -->
  <rect class="dev" x="612" y="96" width="624" height="448" rx="12"/>
  <text class="kb kd" x="632" y="124">LOCALLY FINE-TUNED GLIMMER 30B MODEL</text>
  <text class="hb" x="632" y="156">StowLM Reader</text>
  <text class="f" x="822" y="156">Muse Glimmer 30B + our LoRA adapter</text>
  <text class="s" x="632" y="182"><tspan class="d">Does: </tspan>reads the planner's words into strict rules (four kinds); refuses anything</text>
  <text class="s" x="632" y="202">else. Runs on this laptop with no cloud call.</text>
  <text class="s" x="632" y="228"><tspan class="d">Trained: </tspan>here, on an M5 Max with MLX: LoRA (rank 8, last 16 blocks) on the 4-bit</text>
  <text class="s" x="632" y="248">base, in three stages: grammar sentences and 1,228 Muse Spark paraphrases, then</text>
  <text class="s" x="632" y="268">error and safety examples, then 4,121 domain rows; 5 checkpoints averaged (SWA).</text>
  <text class="s" x="632" y="294"><tspan class="d">Decodes: </tspan>through a feasibility mask, a logits processor that allows only the</text>
  <text class="s" x="632" y="314">output schema, real bays and allowed classes. Legal can still be wrong, so the</text>
  <text class="s" x="632" y="334">planner confirms every reading.</text>
  <rect class="fig" x="632" y="348" width="586" height="86" rx="8"/>
  <text class="fb" x="646" y="372">118 of 128 on the sealed reader test (92.19 %)</text>
  <text class="note" x="646" y="394">Untrained Glimmer under the same mask: 60 of 128 (46.88 %)</text>
  <text class="note" x="646" y="416">Cleared the 90 % gate; missed two stricter ones (one loosening accepted)</text>
  <rect class="fig" x="632" y="444" width="586" height="86" rx="8"/>
  <text class="fb" x="646" y="468">Mask overrode the first choice: 182 of 200 before fine-tuning, 2 after</text>
  <text class="note" x="646" y="490">Validation sentences; almost all were output format, none an illegal bay or tier</text>
  <text class="note" x="646" y="512">Both of the 2 were sentences it should have refused</text>

  <!-- software row -->
  <rect class="sw" x="48" y="590" width="270" height="280" rx="10"/>
  <text class="k ks" x="62" y="614">PERSON</text>
  <text class="h" x="62" y="640">Planner confirms</text>
  <text class="h" x="62" y="664">the reading</text>
  <text class="s2" x="62" y="690">sees each rule in plain words;</text>
  <text class="s2" x="62" y="708">nothing binds until confirmed.</text>
  <text class="s2" x="62" y="732">Intake rows Spark isn't sure of</text>
  <text class="s2" x="62" y="750">stop for the planner too.</text>

  <rect class="sw" x="356" y="590" width="270" height="280" rx="10"/>
  <text class="k ks" x="370" y="614">SOFTWARE · THE ENGINE SLOT</text>
  <text class="h" x="370" y="640">Frontier Engine 0.13.0</text>
  <text class="s2" x="370" y="666">Plans the section from the load</text>
  <text class="s2" x="370" y="684">list and the confirmed rules:</text>
  <text class="s2" x="370" y="702">search, an assignment LP and a</text>
  <text class="s2" x="370" y="720">rule-tier ladder.</text>
  <text class="s2" x="370" y="744"><tspan class="d">Developed</tspan> in a coding-agent</text>
  <text class="s2" x="370" y="762">improvement loop: each cycle,</text>
  <text class="s2" x="370" y="780">agents tried changes; reviews and</text>
  <text class="s2" x="370" y="798">a fixed benchmark kept only</text>
  <text class="s2" x="370" y="816">measured gains (0.9 → 0.13.0).</text>
  <text class="s2" x="370" y="840">A firm's own engine can take</text>
  <text class="s2" x="370" y="858">this slot (design; none ported yet).</text>

  <rect class="sw" x="664" y="590" width="270" height="280" rx="10"/>
  <text class="k ks" x="678" y="614">SOFTWARE · DECIDES</text>
  <text class="h" x="678" y="640">Full checker</text>
  <text class="s2" x="678" y="666">54 active rules in tiers T0–T5:</text>
  <text class="s2" x="678" y="684">IMDG segregation, stability on</text>
  <text class="s2" x="678" y="702">the public KCS hull, securing</text>
  <text class="s2" x="678" y="720">(approximation), expert rules. A</text>
  <text class="s2" x="678" y="738">relaxed plan names each break.</text>
  <text class="s2" x="678" y="762"><tspan class="d">Developed</tspan> by coding agents from</text>
  <text class="s2" x="678" y="780">public regulations and a field</text>
  <text class="s2" x="678" y="798">expert's rules, with independent</text>
  <text class="s2" x="678" y="816">code, physics and logic reviews;</text>
  <text class="s2" x="678" y="834">hydrostatics checked against KCS.</text>

  <rect class="sw" x="972" y="590" width="264" height="280" rx="10"/>
  <text class="k ks" x="986" y="614">OUTPUT</text>
  <text class="h" x="986" y="640">Signed handover package</text>
  <text class="s2" x="986" y="666">bay plans, crane sequence and a</text>
  <text class="s2" x="986" y="684">note to the master; an Ed25519-</text>
  <text class="s2" x="986" y="702">signed receipt ties each step to</text>
  <text class="s2" x="986" y="720">its model, hash and verdict;</text>
  <text class="s2" x="986" y="738">verify it offline against our</text>
  <text class="s2" x="986" y="756">published key.</text>
  <text class="s2" x="986" y="780"><tspan class="d">Developed</tspan> by coding agents, with</text>
  <text class="s2" x="986" y="798">independent code and logic</text>
  <text class="s2" x="986" y="816">reviews.</text>

  <!-- arrows -->
  <path class="arrow" d="M258,152 L296,152"/>
  <path class="arrow" d="M258,305 L296,305"/>
  <path class="arrow" d="M570,152 L608,152"/>
  <!-- spark load list to the engine -->
  <path class="arrow" d="M491,400 L491,586"/>
  <text class="note" x="478" y="452" text-anchor="end">load list; rows it isn't sure of</text>
  <text class="note" x="478" y="470" text-anchor="end">stop for the planner</text>
  <!-- reader to confirm; hops over the load-list line -->
  <path class="arrow" d="M760,544 L760,566 L503,566 A12,12 0 0 0 479,566 L183,566 L183,586"/>
  <text class="note" x="560" y="558">reading</text>
  <path class="arrow" d="M318,700 L352,700"/>
  <path class="arrow" d="M626,700 L660,700"/>
  <path class="arrow" d="M934,700 L968,700"/>

  </g>
</svg>
