<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-labelledby="t d">
  <title id="t">StowLM pipeline</title>
  <desc id="d">Voyage documents go to Muse Spark and a planner's spoken words to Muse Voice Transcribe; StowLM Reader, a fine-tuned Muse Glimmer 30B on the laptop with a feasibility decode mask, reads the words into rules; the planner confirms the reading; Frontier Engine 0.13.0 plans; the full checker decides; a signed handover package comes out. All inside one hashed pipeline, manifest v4.</desc>
  <style>
    svg { --bg:#ffffff; --ink:#0f172a; --muted:#475569; --line:#64748b; --frame:#94a3b8;
          --cloud-bg:#fff7ea; --cloud:#b45309; --dev-bg:#ecfdf5; --dev:#047857;
          --sw-bg:#f1f5f9; --sw:#334155; --fig-bg:#ffffff; --tab:#e2e8f0; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#050a16; --ink:#f4f6fb; --muted:#c9d2e3; --line:#8ea0bf; --frame:#41506b;
            --cloud-bg:#2a1d08; --cloud:#ffb547; --dev-bg:#062a20; --dev:#4be0a0;
            --sw-bg:#0f1a30; --sw:#a9b8d3; --fig-bg:#081022; --tab:#13203a; }
    }
    text { font-family: -apple-system, system-ui, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .h { font-size: 20px; font-weight: 700; }
    .hb { font-size: 24px; font-weight: 800; }
    .k { font-size: 13px; font-weight: 700; letter-spacing: .06em; }
    .s { font-size: 15px; fill: var(--muted); }
    .f { font-size: 15px; }
    .fb { font-size: 15px; font-weight: 700; }
    .tab { font-size: 16px; font-weight: 700; }
    .note { font-size: 14px; fill: var(--muted); }
    .bg { fill: var(--bg); }
    .frame { fill: none; stroke: var(--frame); stroke-width: 2; stroke-dasharray: 8 6; }
    .tabbox { fill: var(--tab); stroke: var(--frame); stroke-width: 1.5; }
    .in { fill: var(--sw-bg); stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 4; }
    .cloud { fill: var(--cloud-bg); stroke: var(--cloud); stroke-width: 2; }
    .dev { fill: var(--dev-bg); stroke: var(--dev); stroke-width: 3; }
    .sw { fill: var(--sw-bg); stroke: var(--sw); stroke-width: 2; }
    .fig { fill: var(--fig-bg); stroke: var(--dev); stroke-width: 1.2; }
    .kc { fill: var(--cloud); } .kd { fill: var(--dev); } .ks { fill: var(--sw); }
    .arrow { fill: none; stroke: var(--line); stroke-width: 2.4; marker-end: url(#a); }
    .bridge { fill: var(--bg); }
    .head { fill: var(--line); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="820"/>
  <text class="hb" x="40" y="40">StowLM pipeline</text>
  <text class="note" x="1240" y="40" text-anchor="end">amber: Meta Model API, cloud · green: on this laptop · grey: software</text>

  <!-- one hashed pipeline -->
  <rect class="frame" x="24" y="64" width="1232" height="688" rx="16"/>
  <rect class="tabbox" x="44" y="52" width="420" height="28" rx="8"/>
  <text class="tab" x="58" y="72">One hashed pipeline (manifest v4, acf2f275…)</text>

  <!-- inputs -->
  <rect class="in" x="48" y="104" width="210" height="96" rx="10"/>
  <text class="k ks" x="62" y="128">INPUT</text>
  <text class="h" x="62" y="152">Planner's words</text>
  <text class="s" x="62" y="174">typed, or called over</text>
  <text class="s" x="62" y="192">a bad radio line</text>

  <rect class="in" x="48" y="244" width="210" height="96" rx="10"/>
  <text class="k ks" x="62" y="268">INPUT</text>
  <text class="h" x="62" y="292">Voyage documents</text>
  <text class="s" x="62" y="314">tally-sheet photo, email,</text>
  <text class="s" x="62" y="332">spreadsheet (synthetic)</text>

  <!-- cloud models -->
  <rect class="cloud" x="300" y="104" width="270" height="96" rx="10"/>
  <text class="k kc" x="314" y="128">META MODEL API · CLOUD</text>
  <text class="h" x="314" y="152">Muse Voice Transcribe</text>
  <text class="s" x="314" y="174">speech to an editable transcript;</text>
  <text class="s" x="314" y="192">typed words skip this step</text>

  <rect class="cloud" x="300" y="224" width="270" height="136" rx="10"/>
  <text class="k kc" x="314" y="248">META MODEL API · CLOUD</text>
  <text class="h" x="314" y="272">Muse Spark</text>
  <text class="s" x="314" y="294">reads paper and pictures, finds</text>
  <text class="s" x="314" y="312">where documents disagree;</text>
  <text class="s" x="314" y="330">copilot: picks checked tools,</text>
  <text class="s" x="314" y="348">software does the arithmetic</text>

  <!-- reader -->
  <rect class="dev" x="612" y="96" width="624" height="330" rx="12"/>
  <text class="k kd" x="632" y="122">ON THIS LAPTOP · NO CLOUD CALL · FINE-TUNED BY US</text>
  <text class="hb" x="632" y="152">StowLM Reader</text>
  <text class="f" x="822" y="152">Muse Glimmer 30B + our LoRA adapter</text>
  <text class="s" x="632" y="176">Reads the planner's words into rules (four kinds); built to refuse anything else.</text>
  <text class="s" x="632" y="196">Feasibility decode mask: a logits processor allows only the output format, real bays</text>
  <text class="s" x="632" y="214">and allowed classes. Legal can still be wrong, so the planner confirms.</text>
  <rect class="fig" x="632" y="228" width="586" height="86" rx="8"/>
  <text class="fb" x="646" y="252">118 of 128 on the sealed reader test (92.19 %)</text>
  <text class="note" x="646" y="274">Untrained Glimmer under the same mask: 60 of 128 (46.88 %)</text>
  <text class="note" x="646" y="296">Cleared the 90 % gate; missed two stricter ones (one loosening accepted)</text>
  <rect class="fig" x="632" y="324" width="586" height="86" rx="8"/>
  <text class="fb" x="646" y="348">Mask overrode the first choice: 182 of 200 before fine-tuning, 2 after</text>
  <text class="note" x="646" y="370">Validation sentences; almost all were output format, none an illegal bay or tier</text>
  <text class="note" x="646" y="392">Both of the 2 were sentences it should have refused</text>

  <!-- software row -->
  <rect class="sw" x="48" y="490" width="270" height="150" rx="10"/>
  <text class="k ks" x="62" y="514">PERSON</text>
  <text class="h" x="62" y="540">Planner confirms</text>
  <text class="h" x="62" y="564">the reading</text>
  <text class="s" x="62" y="590">sees the rule in plain words;</text>
  <text class="s" x="62" y="608">nothing binds until confirmed</text>

  <rect class="sw" x="356" y="490" width="270" height="150" rx="10"/>
  <text class="k ks" x="370" y="514">SOFTWARE</text>
  <text class="h" x="370" y="540">Frontier Engine 0.13.0</text>
  <text class="s" x="370" y="564">search software plans the</text>
  <text class="s" x="370" y="582">half-ship section from the load</text>
  <text class="s" x="370" y="600">list and the confirmed rules</text>

  <rect class="sw" x="664" y="490" width="270" height="150" rx="10"/>
  <text class="k ks" x="678" y="514">SOFTWARE · DECIDES</text>
  <text class="h" x="678" y="540">Full checker</text>
  <text class="s" x="678" y="564">54 active rules, in tiers;</text>
  <text class="s" x="678" y="582">a pass is a full checker pass;</text>
  <text class="s" x="678" y="600">a relaxed plan names every</text>
  <text class="s" x="678" y="618">rule it breaks</text>

  <rect class="sw" x="972" y="490" width="264" height="150" rx="10"/>
  <text class="k ks" x="986" y="514">OUTPUT</text>
  <text class="h" x="986" y="540">Signed handover package</text>
  <text class="s" x="986" y="564">bay plans, crane sequence,</text>
  <text class="s" x="986" y="582">note to the master; a receipt</text>
  <text class="s" x="986" y="600">ties each step to its model,</text>
  <text class="s" x="986" y="618">hash and verdict</text>

  <!-- arrows -->
  <path class="arrow" d="M258,152 L296,152"/>
  <path class="arrow" d="M258,292 L296,292"/>
  <path class="arrow" d="M570,152 L608,152"/>
  <!-- spark load list to the engine -->
  <path class="arrow" d="M491,360 L491,486"/>
  <text class="note" x="478" y="404" text-anchor="end">load list; rows it isn't sure of</text>
  <text class="note" x="478" y="422" text-anchor="end">stop for the planner</text>
  <!-- reader to confirm; hops over the load-list line -->
  <path class="arrow" d="M760,426 L760,452 L503,452 A12,12 0 0 0 479,452 L183,452 L183,486"/>
  <text class="note" x="560" y="444">reading</text>
  <path class="arrow" d="M318,565 L352,565"/>
  <path class="arrow" d="M626,565 L660,565"/>
  <path class="arrow" d="M934,565 L968,565"/>

  <text class="f" x="48" y="690">Models propose. Software decides.</text>
  <text class="note" x="48" y="716">Synthetic ships and cargo, simulated port · Designed for up to 195 boxes in a half-ship section of 500–800 TEU feeder ships, up to 70 % fill · Research pilot, not for use on a real ship</text>
  <text class="note" x="40" y="790">The reader figures are from the sealed v3 reader test (locked before tuning, scored once). Mask counts are on 200 validation sentences, not the locked test.</text>
</svg>
